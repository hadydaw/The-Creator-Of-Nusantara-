name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan template ekspor
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -r /root/.local/share/godot/export_templates/* "$HOME/.local/share/godot/export_templates/"
          ls "$HOME/.local/share/godot/export_templates"

      - name: Siapkan keystore dan pengaturan Android
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$PWD/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          JAVA_BIN="$(readlink -f "$(which javac)")"
          JDK="$(dirname "$(dirname "$JAVA_BIN")")"
          echo "SDK=$SDK JDK=$JDK"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JDK"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT

      - name: Import proyek
        run: godot --headless --import || true

      - name: Ekspor APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/PulauKabut.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: PulauKabut-apk
          path: build/PulauKabut.apk

      - name: Rilis APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pulau Kabut build ${{ github.run_number }}
          files: build/PulauKabut.apk
